
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Question For You</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffe1ec, #fff0f5);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

#main {
    width: 100%;
    padding: 20px;
    position: relative;
    z-index: 2;
}

.heart {
    font-size: 65px;
}

h1 {
    color: #d6336c;
    font-size: clamp(28px, 6vw, 45px);
}

p {
    color: #a83260;
    font-size: 19px;
}

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-top: 35px;
    min-height: 100px;
}

button {
    border: none;
    padding: 14px 30px;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
    font-weight: bold;
}

#yes {
    background: #ff4f87;
    color: white;
    position: relative;
    z-index: 10;
    transition: font-size 0.3s, padding 0.3s;
}

#no {
    background: white;
    color: #d6336c;
    border: 2px solid #ff4f87;
    z-index: 11;
}

#success {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    background: linear-gradient(135deg, #ff4f87, #ff91b5);
    color: white;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 25px;
}

#success h1,
#success p {
    color: white;
    line-height: 1.8;
}

#success h1 {
    font-size: clamp(35px, 8vw, 65px);
}

#success p {
    max-width: 500px;
}

#hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 30;
    overflow: hidden;
}

.floating {
    position: absolute;
    bottom: -50px;
    animation: floatUp 4s linear forwards;
}

@keyframes floatUp {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div id="main">
    <div class="heart">&#128151;</div>

    <h1 id="question">Will you be my girlfriend? &#129402;</h1>

    <p id="subtitle">Please say yes... &#128064;</p>

    <div class="buttons">
        <button id="yes" onclick="sayYes()">
            YES &#128150;
        </button>

        <button id="no" onclick="sayNo()">
            NO &#128557;
        </button>
    </div>
</div>

<div id="success">
    <div class="heart">&#128150;</div>
    <h1>YAAAAAY!!! &#129402;</h1>

    <p>
        I knew you would say yes! &#128149;<br>
        You just made me the happiest person ever.<br>
        Thank you for being someone so special to me.
    </p>

    <h2>MWA MWA MWA &#128139;</h2>
</div>

<div id="hearts"></div>

<script>
let size = 1;
let noClicks = 0;

const yes = document.getElementById("yes");
const no = document.getElementById("no");
const question = document.getElementById("question");
const subtitle = document.getElementById("subtitle");

const messages = [
    "Are you sure? &#128532;",
    "PLEASEEEE! &#128557;",
    "Think again, pretty please?",
    "You're breaking my heart!",
    "The YES button is getting stronger!",
    "JUST SAY YES ALREADY!"
];

function sayNo() {
    noClicks++;
    size *= 1.4;

    question.innerHTML =
        messages[Math.min(noClicks - 1, messages.length - 1)];

    subtitle.innerHTML =
        "The NO button isn't helping you!";

    if (noClicks >= 5) {
        yes.style.position = "fixed";
        yes.style.inset = "0";
        yes.style.width = "100vw";
        yes.style.height = "100vh";
        yes.style.borderRadius = "0";
        yes.style.padding = "0";
        yes.style.fontSize = "60px";
        yes.style.zIndex = "15";
    } else {
        yes.style.fontSize = (18 * size) + "px";
        yes.style.padding = (14 * size) + "px " +
                            (30 * size) + "px";
    }

    if (noClicks >= 3) {
        no.style.transform =
            "translate(" + (Math.random() * 100 - 50) +
            "px, " + (Math.random() * 80 - 40) + "px)";
    }
}

function sayYes() {
    document.getElementById("success").style.display = "flex";
    yes.style.display = "none";
    no.style.display = "none";

    for (let i = 0; i < 60; i++) {
        setTimeout(createHeart, i * 60);
    }
}

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "floating";

    const hearts = [
        "&#128151;",
        "&#128150;",
        "&#128149;",
        "&#128152;",
        "&#127800;"
    ];

    heart.innerHTML =
        hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize =
        (20 + Math.random() * 30) + "px";

    document.getElementById("hearts").appendChild(heart);

    setTimeout(function() {
        heart.remove();
    }, 4000);
}
</script>

</body>
</html>
